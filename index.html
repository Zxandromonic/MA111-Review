<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MA111 Study Hub</title>
<style>
:root{
 --bg:#161513;--card:#201e19;--ink:#efe9df;--sub:#a39c8e;
 --accent:#96594a;--accent2:#2e5f4e;
 --line:#39342b;--warn-bg:#221d18;--warn-line:#96594a;--good:#3f7c62;--bad:#a56656;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;line-height:1.55;min-height:100%;}
.wrap{max-width:780px;margin:0 auto;padding:2.2rem 1.2rem 4rem;}
h1{font-size:1.7rem;margin:0 0 0.15rem;}
.tag{color:var(--sub);font-size:0.95rem;margin-bottom:1.6rem;font-style:italic;}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
nav{display:flex;flex-wrap:wrap;gap:0.4rem 0.8rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0.8rem 0;margin-bottom:1.8rem;font-size:0.85rem;}
nav a{color:var(--accent2);text-decoration:none;}
nav a:hover{text-decoration:underline;}
.rule-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:0.9rem 1.1rem;margin-bottom:2rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.92rem;}
.rule-box strong{color:var(--warn-line);}
section{margin-bottom:2.4rem;scroll-margin-top:1rem;}
h2{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:1.15rem;color:var(--accent);border-bottom:2px solid var(--line);padding-bottom:0.3rem;margin-bottom:0.9rem;}
h3{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.98rem;color:var(--accent2);margin:1.1rem 0 0.4rem;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0.9rem 1.1rem;margin-bottom:0.8rem;}
.card p{margin:0.45rem 0;}
.formula{font-size:1.05rem;margin:0.5rem 0;}
ul,ol{margin:0.3rem 0;padding-left:1.3rem;}
li{margin-bottom:0.35rem;}
.small{font-size:0.88rem;color:var(--sub);}
table{width:100%;border-collapse:collapse;font-size:0.88rem;margin:0.5rem 0;}
th,td{border:1px solid var(--line);padding:0.35rem 0.5rem;text-align:center;vertical-align:middle;}
th{background:var(--warn-bg);font-family:-apple-system,sans-serif;font-size:0.78rem;}
.allowed{color:var(--good);font-weight:bold;}
.banned{color:var(--bad);font-weight:bold;}
.overflow-x{overflow-x:auto;}
/* Math notation */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 0.2em;line-height:1.2;font-size:0.95em;}
.frac .num{padding:0 0.25em 0.1em;border-bottom:1px solid currentColor;}
.frac .den{padding:0.1em 0.25em 0;}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin-right:0.3em;}
.limu{font-size:0.72em;white-space:nowrap;}
.rad{white-space:nowrap;}
.radic{border-top:1px solid currentColor;padding:0 0.1em;margin-left:0.03em;}
/* Hero / home */
.hero{text-align:center;padding:2.2rem 0 1.4rem;}
.hero .word{font-size:3.4rem;font-weight:700;letter-spacing:0.04em;margin:0;color:var(--accent);}
.hero .sub{color:var(--sub);font-family:-apple-system,sans-serif;font-size:1rem;margin-top:0.4rem;}
.home-btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.3rem;margin-bottom:0.9rem;cursor:pointer;font-family:-apple-system,sans-serif;font-size:1.05rem;font-weight:600;color:var(--ink);transition:border-color .15s;}
.home-btn:hover{border-color:var(--accent);}
.home-btn .desc{display:block;font-weight:400;font-size:0.85rem;color:var(--sub);margin-top:0.25rem;}
.home-btn.disabled{opacity:0.4;cursor:default;}
.home-btn.disabled:hover{border-color:var(--line);}
.backbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:0.4rem 0.8rem;font-family:-apple-system,sans-serif;font-size:0.85rem;color:var(--sub);cursor:pointer;margin-bottom:1.2rem;}
.backbtn:hover{border-color:var(--accent2);color:var(--accent2);}
/* Quiz */
.chip{display:inline-block;font-family:-apple-system,sans-serif;font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:6px;border:1px solid var(--line);margin:0.1rem;cursor:pointer;user-select:none;}
.chip.on{background:var(--accent2);color:#efe9df;border-color:var(--accent2);}
.diffbadge{font-family:-apple-system,sans-serif;font-size:0.7rem;padding:0.1rem 0.5rem;border-radius:6px;font-weight:600;}
.d-easy{background:#25352a;color:#8fbf9f;}
.d-medium{background:#332c1c;color:#d1b06a;}
.d-hard{background:#32241a;color:#cf8f6a;}
.d-veryhard{background:#331e1c;color:#cf8484;}
.navgrid{display:flex;flex-wrap:wrap;gap:0.35rem;margin-bottom:1.1rem;}
.navbtn{width:2.2rem;height:2.2rem;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-family:-apple-system,sans-serif;font-size:0.8rem;cursor:pointer;padding:0;}
.navbtn:hover{border-color:var(--accent2);}
.navbtn.sel{background:#2a2822;color:var(--ink);border-color:var(--sub);}
.navbtn.ok{border-color:var(--good);color:var(--good);}
.navbtn.no{border-color:var(--bad);color:var(--bad);}
.navbtn.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink);}
.qtext{font-size:1.12rem;margin:0.4rem 0 1rem;line-height:1.8;}
.qopt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0.6rem 0.9rem;margin-bottom:0.5rem;cursor:pointer;font-family:-apple-system,sans-serif;font-size:0.95rem;color:var(--ink);}
.qopt:hover{border-color:var(--accent2);}
.qopt.picked{border-color:var(--accent2);background:#1d2a24;}
.qopt.correct{border-color:var(--good);background:#1d2a24;}
.qopt.wrong{border-color:var(--bad);background:#2a1f1b;}
.qopt.locked{cursor:default;}
.btnrow{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:1rem;}
.primarybtn{background:var(--accent2);color:#efe9df;border:none;border-radius:8px;padding:0.6rem 1.2rem;font-family:-apple-system,sans-serif;font-size:0.95rem;cursor:pointer;font-weight:700;}
.primarybtn:hover{opacity:0.88;}
.secbtn{background:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0.6rem 1.1rem;font-family:-apple-system,sans-serif;font-size:0.95rem;cursor:pointer;}
.secbtn:hover{border-color:var(--accent2);}
button[disabled]{opacity:0.4;cursor:default;pointer-events:none;}
.quizcta{display:block;width:100%;text-align:center;background:var(--accent2);color:#efe9df;border:1px solid var(--line);border-radius:10px;padding:1.1rem;font-family:-apple-system,sans-serif;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:1rem;}
.quizcta:hover{opacity:0.9;}
.revq{border-left:3px solid var(--line);}
.revq.ok{border-left-color:var(--good);}
.revq.no{border-left-color:var(--bad);}
.revhead{font-family:-apple-system,sans-serif;font-size:0.78rem;color:var(--sub);margin-bottom:0.3rem;}
.ans{font-family:-apple-system,sans-serif;font-size:0.9rem;margin:0.25rem 0;}
.ans.good{color:var(--good);}
.ans.bad{color:var(--bad);}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Notation helpers ---------- */
function F(n,d){return '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';}
function LIM(sub){return '<span class="lim"><span class="limw">lim</span><span class="limu">'+sub+'</span></span>';}
function LM(sub,body,res){return LIM(sub)+' '+body+(res!==undefined?' = '+res:'');}
function R(x){return '<span class="rad">√<span class="radic">'+x+'</span></span>';}

const state = { view:'home', exam:1, quizQuestions:[], quizIdx:0, selectedTopics:new Set(), selectedDiffs:new Set(['easy','medium','hard','veryhard']) };

const TOPICS = ['Functions','Logs','Trig','Limits','Continuity','IVT','Epsilon-Delta','Derivatives'];
state.selectedTopics = new Set(TOPICS);

const DIFF_LABEL = {easy:'Easy',medium:'Medium',hard:'Hard',veryhard:'Very Hard'};

/* ---------- Quiz bank (all text is HTML) ---------- */
const QUIZ_BANK = [
 /* Functions */
 {topic:'Functions',diff:'easy',q:'What is the range of f(x) = e<sup>x</sup>?',opts:['(−∞, ∞)','(0, ∞)','[0, ∞)','(−∞, 0)'],correct:1,
  exp:'e<sup>x</sup> is always positive and gets arbitrarily close to 0, so the range is (0, ∞).'},
 {topic:'Functions',diff:'medium',q:'A function is invertible on its whole domain if it is…',opts:['Continuous','One-to-one (passes the horizontal line test)','Increasing only','Defined everywhere'],correct:1,
  exp:'Invertibility requires one-to-one: each output comes from exactly one input.'},
 {topic:'Functions',diff:'hard',q:'If f(x) = '+F('2x + 1','3x − 5')+', what is the domain of f<sup>−1</sup>(x)?',opts:['All reals','All reals except '+F('5','3'),'All reals except '+F('2','3'),'All reals except 0'],correct:2,
  exp:'Domain of f<sup>−1</sup> = range of f. The function f never outputs '+F('2','3')+' (its horizontal asymptote), so that value is excluded.'},
 {topic:'Functions',diff:'veryhard',q:'Find the domain of f(x) = '+F('ln(9 − x<sup>2</sup>)',R('x + 1'))+'.',opts:['(−1, 3)','(−3, 3)','(−1, 3]','(−∞, 3)'],correct:0,
  exp:'Need 9 − x<sup>2</sup> &gt; 0, so −3 &lt; x &lt; 3. Also x + 1 &gt; 0 (strict, since the root is in the denominator), so x &gt; −1. Intersection: (−1, 3).'},

 /* Logs */
 {topic:'Logs',diff:'easy',q:'ln(e<sup>5</sup>) = ?',opts:['5','e<sup>5</sup>','1','ln 5'],correct:0,
  exp:'ln and e are inverses, so ln(e<sup>5</sup>) = 5.'},
 {topic:'Logs',diff:'medium',q:'log<sub>2</sub>(16) − log<sub>2</sub>(4) simplifies to:',opts:['2','4','log<sub>2</sub>(12)','8'],correct:0,
  exp:'log<sub>2</sub>('+F('16','4')+') = log<sub>2</sub>(4) = 2.'},
 {topic:'Logs',diff:'hard',q:'Simplify e<sup>2 ln x + ln y</sup>:',opts:['2x + y','x<sup>2</sup>y','x<sup>2</sup> + y','2xy'],correct:1,
  exp:'2 ln x + ln y = ln(x<sup>2</sup>y), and e<sup>ln(x<sup>2</sup>y)</sup> = x<sup>2</sup>y.'},
 {topic:'Logs',diff:'veryhard',q:'If ln A = 3 ln(x − 2) − '+F('1','2')+' ln y + 4, then A equals:',
  opts:[F('(x − 2)<sup>3</sup> e<sup>4</sup>',R('y')),'3(x − 2)'+'·'+F('1',R('y'))+' + 4',(  '(x − 2)<sup>3</sup>'+R('y')+' e<sup>4</sup>'),'e<sup>4</sup>(x − 2)<sup>3</sup> − '+R('y')],correct:0,
  exp:'Combine: ln A = ln[(x − 2)<sup>3</sup>] − ln['+R('y')+'] + ln(e<sup>4</sup>) = ln['+F('(x − 2)<sup>3</sup> e<sup>4</sup>',R('y'))+'], so A = '+F('(x − 2)<sup>3</sup> e<sup>4</sup>',R('y'))+'.'},

 /* Trig */
 {topic:'Trig',diff:'easy',q:'What is the domain of tan θ?',opts:['All reals','All reals except θ = '+F('π','2')+' + kπ','All reals except θ = kπ','[−1, 1]'],correct:1,
  exp:'tan θ = '+F('sin θ','cos θ')+' is undefined wherever cos θ = 0, i.e. θ = '+F('π','2')+' + kπ.'},
 {topic:'Trig',diff:'medium',q:'What is the range of sec θ?',opts:['[−1, 1]','(−∞, ∞)','(−∞, −1] ∪ [1, ∞)','[0, ∞)'],correct:2,
  exp:'sec θ = '+F('1','cos θ')+', and since |cos θ| ≤ 1 (and cos θ ≠ 0), we get |sec θ| ≥ 1.'},
 {topic:'Trig',diff:'hard',q:'The restricted domain used to define arccos x is:',opts:['['+'−'+F('π','2')+', '+F('π','2')+']','[0, π]','[−π, 0]','('+'−'+F('π','2')+', '+F('π','2')+')'],correct:1,
  exp:'cos is restricted to [0, π] so that it is one-to-one before inverting.'},
 {topic:'Trig',diff:'veryhard',q:'Solve sin(2θ) = cos θ on [0, 2π). How many solutions are there?',opts:['2','3','4','6'],correct:2,
  exp:'2 sin θ cos θ − cos θ = 0, so cos θ (2 sin θ − 1) = 0. cos θ = 0 gives θ = '+F('π','2')+', '+F('3π','2')+'; sin θ = '+F('1','2')+' gives θ = '+F('π','6')+', '+F('5π','6')+'. Total: 4 solutions.'},

 /* Limits */
 {topic:'Limits',diff:'easy',q:'Evaluate '+LM('x→3',F('x<sup>2</sup> − 9','x − 3'))+'.',opts:['0','6','Undefined','3'],correct:1,
  exp:'Factor: '+F('(x − 3)(x + 3)','x − 3')+' = x + 3, which approaches 3 + 3 = 6.'},
 {topic:'Limits',diff:'easy',q:'Evaluate '+LM('x→0',F('sin x','x'))+'.',opts:['0','1','Undefined','∞'],correct:1,
  exp:'This is the fundamental trig limit, proven with the Squeeze Theorem.'},
 {topic:'Limits',diff:'medium',q:'Evaluate '+LM('t→1',F('t<sup>2</sup> + t − 2','t<sup>2</sup> − 1'))+'.',opts:[F('3','2'),'0','1','Does not exist'],correct:0,
  exp:'t is approaching a finite number and substitution gives 0/0, so factor and cancel: '+F('(t + 2)(t − 1)','(t − 1)(t + 1)')+' = '+F('t + 2','t + 1')+', which approaches '+F('3','2')+'.'},
 {topic:'Limits',diff:'medium',q:'Evaluate '+LM('h→0',F(R('4 + h')+' − 2','h'))+' without derivatives.',opts:[F('1','4'),'4',F('1','2'),'2'],correct:0,
  exp:'Multiply top and bottom by the conjugate: '+F('(4 + h) − 4','h('+R('4 + h')+' + 2)')+' = '+F('1',R('4 + h')+' + 2')+', which approaches '+F('1','4')+'.'},
 {topic:'Limits',diff:'medium',q:'Evaluate '+LM('x→∞',F('3x<sup>2</sup> + 1','6x<sup>2</sup> − x'))+'.',opts:['0',F('1','2'),'∞','3'],correct:1,
  exp:'Divide top and bottom by x<sup>2</sup>: '+F('3 + '+F('1','x<sup>2</sup>'),'6 − '+F('1','x'))+' → '+F('3','6')+' = '+F('1','2')+'.'},
 {topic:'Limits',diff:'hard',q:'Evaluate '+LM('x→−2<sup>+</sup>',F('x − 1','x + 2'))+'.',opts:['+∞','−∞','0',F('−3','2')],correct:1,
  exp:'As x → −2<sup>+</sup>, the numerator → −3 (negative) and the denominator → 0<sup>+</sup> (tiny and positive). Negative divided by tiny positive gives −∞.'},
 {topic:'Limits',diff:'hard',q:'Evaluate '+LM('x→0',F('tan 3x','sin 5x'))+'.',opts:[F('3','5'),F('5','3'),'0','1'],correct:0,
  exp:'Rewrite tan 3x = '+F('sin 3x','cos 3x')+' and build the special-limit form: '+F('sin 3x','3x')+' · '+F('5x','sin 5x')+' · '+F('3','5')+' · '+F('1','cos 3x')+' → 1 · 1 · '+F('3','5')+' · 1 = '+F('3','5')+'.'},
 {topic:'Limits',diff:'hard',q:'Evaluate '+LM('y→0',F('sin 11y','tan 8y'))+'.',opts:[F('11','8'),F('8','11'),'1','0'],correct:0,
  exp:'Write tan 8y = '+F('sin 8y','cos 8y')+', then multiply to build sin(ky)/(ky) forms: '+F('sin 11y','11y')+' · '+F('8y','sin 8y')+' · '+F('11','8')+' · cos 8y → '+F('11','8')+'.'},
 {topic:'Limits',diff:'veryhard',q:'Evaluate '+LM('x→∞','[x − '+R('x<sup>2</sup> + 3x')+']')+' (rationalize; no shortcuts).',opts:['0',F('−3','2'),'∞','3'],correct:1,
  exp:'Multiply by the conjugate over itself: '+F('x<sup>2</sup> − (x<sup>2</sup> + 3x)','x + '+R('x<sup>2</sup> + 3x'))+' = '+F('−3x','x + '+R('x<sup>2</sup> + 3x'))+'. Divide top and bottom by x: '+F('−3','1 + 1')+' = '+F('−3','2')+'.'},
 {topic:'Limits',diff:'veryhard',q:'The limit '+LM('x→∞','['+R('x<sup>2</sup> + 6x')+' − x]')+' is an ∞ − ∞ form. What technique applies first?',opts:['Multiply by the conjugate','Divide by x immediately','Squeeze Theorem','Factor and cancel'],correct:0,
  exp:'∞ − ∞ forms with a root are handled by multiplying by the conjugate first. That turns it into a ∞/∞ form you can then divide through by x.'},

 /* Continuity */
 {topic:'Continuity',diff:'easy',q:'For f to be continuous at x = c, which of these is NOT required?',opts:['f(c) exists',LM('x→c','f(x)')+' exists','f is differentiable at c',LM('x→c','f(x)','f(c)')],correct:2,
  exp:'Continuity needs the three-part definition. Differentiability is a stronger, separate condition.'},
 {topic:'Continuity',diff:'medium',q:'A function is right-continuous at c if:',opts:[LM('x→c<sup>−</sup>','f(x)','f(c)'),LM('x→c<sup>+</sup>','f(x)','f(c)'),'f(c) is undefined',LM('x→c','f(x)')+' does not exist'],correct:1,
  exp:'Right-continuity only checks the limit from the right side against f(c).'},
 {topic:'Continuity',diff:'hard',q:'Let f(x) = ax<sup>2</sup> + 3 for x &lt; 2 and f(x) = 5x − a for x ≥ 2. Find a so that f is continuous at x = 2.',opts:['a = 1','a = '+F('7','5'),'a = 2','a = 5'],correct:1,
  exp:'Set the one-sided limits equal: 4a + 3 = 10 − a, so 5a = 7 and a = '+F('7','5')+'.'},
 {topic:'Continuity',diff:'veryhard',q:'Let g(x) = '+F('x<sup>2</sup> − 4','x − 2')+' for x ≠ 2, and g(2) = 5. At x = 2, g is:',opts:['Continuous','Discontinuous, removable','Discontinuous, jump','Discontinuous, infinite'],correct:1,
  exp:LM('x→2','g(x)','4')+' but g(2) = 5. The limit exists and disagrees with the function value, which is a removable discontinuity.'},

 /* IVT */
 {topic:'IVT',diff:'easy',q:'The Intermediate Value Theorem requires f to be continuous on:',opts:['An open interval (a, b)','A closed interval [a, b]','All real numbers','Just the endpoints'],correct:1,
  exp:'The hypothesis is continuity on the closed interval [a, b].'},
 {topic:'IVT',diff:'medium',q:'The IVT guarantees:',opts:['Exactly one solution','At least one solution','No solutions','A unique maximum'],correct:1,
  exp:'IVT only guarantees existence of at least one c, not uniqueness.'},
 {topic:'IVT',diff:'hard',q:'To show x<sup>3</sup> − 4x + 1 = 0 has a root in [0, 1] using the IVT, the key step is showing:',opts:['f is a polynomial (hence continuous) and f(0), f(1) have opposite signs','f(0) = f(1)','f is increasing on [0, 1]','f has a critical point in [0, 1]'],correct:0,
  exp:'You need continuity (a polynomial is continuous everywhere) plus f(0) = 1 and f(1) = −2 on opposite sides of 0.'},
 {topic:'IVT',diff:'veryhard',q:'Which statement about the IVT is FALSE?',opts:['If f(a) and f(b) have the same sign, the IVT cannot be used to guarantee a root','The IVT requires only that f be defined on [a, b], not continuous','A sketch alone is not a valid IVT proof','The IVT can be applied to f(x) = cos x − x to show a fixed point exists'],correct:1,
  exp:'The IVT explicitly requires continuity on [a, b]. Being defined is not enough.'},

 /* Epsilon-Delta */
 {topic:'Epsilon-Delta',diff:'medium',q:'The ε–δ definition of '+LM('x→a','f(x)','L')+' says: whenever 0 &lt; |x − a| &lt; δ, then:',opts:['|f(x) − L| &lt; ε','|x − a| &lt; ε','f(x) = L','|f(x) − L| &lt; δ'],correct:0,
  exp:'The conclusion bounds |f(x) − L| by ε, not δ.'},
 {topic:'Epsilon-Delta',diff:'hard',q:'To prove '+LM('x→2','(4x − 3)','5')+' with ε–δ, the correct choice of δ is:',opts:['δ = ε','δ = '+F('ε','4'),'δ = 4ε','δ = ε<sup>2</sup>'],correct:1,
  exp:'|f(x) − L| = |4x − 3 − 5| = 4|x − 2| &lt; ε requires |x − 2| &lt; '+F('ε','4')+', so δ = '+F('ε','4')+'.'},
 {topic:'Epsilon-Delta',diff:'veryhard',q:'To prove '+LM('x→3',F('x<sup>2</sup> − 9','x − 3'),'6')+' with ε–δ, before running the standard argument you must first:',opts:['Take the derivative','Cancel (x − 3), valid because x ≠ 3 in the definition','Apply L’Hôpital’s Rule','Assume x = 3 directly'],correct:1,
  exp:'Since 0 &lt; |x − a| excludes x = a, canceling (x − 3) is valid. The expression reduces to x + 3, and the linear ε–δ argument applies.'},

 /* Derivatives 3.1-3.2 */
 {topic:'Derivatives',diff:'easy',q:'Which limit defines the derivative f′(a)?',
  opts:[LM('h→0',F('f(a + h) − f(a)','h')),LM('h→0',F('f(a + h) + f(a)','h')),LM('x→a',F('f(x) − f(a)','x + a')),LM('h→0',F('f(a + h)','f(a)'))],correct:0,

/* ---------- DOM helpers ---------- */
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.forEach(c=>{ if(typeof c==='string') e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}
function P(h,cls){return el('p',{class:cls||'',html:h});}
function FM(h){return el('div',{class:'formula',html:h});}
function H3(t){return el('h3',{html:t});}
function UL(items){return el('ul',{html:items.map(i=>'<li>'+i+'</li>').join('')});}
function OL(items){return el('ol',{html:items.map(i=>'<li>'+i+'</li>').join('')});}
function TBL(h){return el('table',{html:h});}
function CARD(cls,...kids){const c=el('div',{class:'card'+(cls?' '+cls:'')});kids.forEach(k=>c.appendChild(k));return c;}
function sec(id,title,...cards){const s=el('section',{id});s.appendChild(el('h2',{html:title}));cards.forEach(c=>s.appendChild(c));return s;}

function render(keepScroll){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view==='home') app.appendChild(renderHome());
  else if(state.view==='review') app.appendChild(state.exam===2?renderReview2():renderReview());
  else if(state.view==='quizsetup') app.appendChild(renderQuizSetup());
  else if(state.view==='quiz') app.appendChild(renderQuiz());
  else if(state.view==='results') app.appendChild(renderResults());
  if(!keepScroll) window.scrollTo(0,0);
}

function sectionLimits(){
  const cTable = CARD('',
    TBL('<tr><th>Technique</th><th>Allowed?</th></tr>'+
     '<tr><td>Factor and cancel</td><td class="allowed">✓ Yes</td></tr>'+
     '<tr><td>Multiply by the conjugate</td><td class="allowed">✓ Yes</td></tr>'+
     '<tr><td>Common denominator, then simplify</td><td class="allowed">✓ Yes</td></tr>'+
     '<tr><td>Trig identities → sin(x)/x form</td><td class="allowed">✓ Yes</td></tr>'+
     '<tr><td>Divide by highest power of x (limits at ∞)</td><td class="allowed">✓ Yes</td></tr>'+
     '<tr><td>Squeeze Theorem</td><td class="allowed">✓ Yes</td></tr>'+
     '<tr><td>L’Hôpital’s Rule</td><td class="banned">✗ Banned</td></tr>'+
     '<tr><td>“Exponentials beat polynomials” reasoning</td><td class="banned">✗ Banned</td></tr>'));

  const cChoose = CARD('',
    H3('Which technique? Look at where x is headed'),
    UL(['<strong>x → ±∞:</strong> divide every term by the highest power of x in the denominator.','<strong>x → a finite number, and substitution gives 0/0:</strong> factor and cancel the common factor, or use the conjugate if a root is involved.']),
    P('Example: '+LM('t→1',F('t<sup>2</sup> + t − 2','t<sup>2</sup> − 1'))+' (t is going to 1, a finite number, and substitution gives 0/0).'),
    FM('= '+LM('t→1',F('(t + 2)(t − 1)','(t − 1)(t + 1)'))+' = '+LM('t→1',F('t + 2','t + 1'))+' = '+F('3','2')));

  const cCold = CARD('',
    H3('The limit to know cold'),
    FM(LM('x→0',F('sin x','x'),'1')),
    P('Any limit that looks like sin(kx)/(kx) as x → 0 reduces to this by multiplying to build the matching argument in numerator and denominator. This is the standard move behind trig-limit problems, and it is proven with the Squeeze Theorem.','small'));

  const cIROC = CARD('',
    H3('The instantaneous-rate-of-change (difference quotient) limits'),
    P('These are the two equivalent limit forms that define the slope of the tangent line, or the instantaneous rate of change, at a point. They come back constantly once derivatives start, so get fluent with the algebra (expanding, factoring, simplifying) now.','small'),
    FM(LM('h→0',F('f(x + h) − f(x)','h'))),
    FM(LM('x→a',F('f(x) − f(a)','x − a'))),
    P('Both compute the same thing. The first slides a second point in by a small step h from x. The second slides a variable point x in toward the fixed point a. Both are 0/0 as written, so simplify (expand f(x + h), factor, cancel the h or the x − a) before plugging in.','small'));

  const cConj = CARD('',
    H3('The conjugate method (0/0 with a root)'),
    P('When a limit gives 0/0 and a square root appears in the numerator or denominator, multiply top and bottom by the conjugate of the radical expression (flip the middle sign). The radical disappears by difference of squares, (a − b)(a + b) = a<sup>2</sup> − b<sup>2</sup>, which usually exposes a factor that cancels.'),
    P('Example:','small'),
    FM(LM('h→0',F(R('4 + h')+' − 2','h'))+' = '+LM('h→0',F('(4 + h) − 4','h('+R('4 + h')+' + 2)'))+' = '+LM('h→0',F('1',R('4 + h')+' + 2'))+' = '+F('1','4')),
    P('The same idea works for an ∞ − ∞ limit involving a root: multiplying by the conjugate converts it to a ∞/∞ (or finite) form you can finish by dividing by the highest power of x.','small'));

  const cForms = CARD('overflow-x',
    H3('The indeterminate forms covered so far'),
    P('Plugging in directly gives something that could evaluate to different things depending on the functions involved, so more algebra is needed before you can read off the answer.','small'),
    TBL('<tr><th>Form</th><th>Try this (no L’Hôpital)</th><th>Typical result</th></tr>'+
     '<tr><td>'+F('0','0')+'</td><td>Factor and cancel, or multiply by the conjugate</td><td>A finite number</td></tr>'+
     '<tr><td>'+F('∞','∞')+'</td><td>Divide top and bottom by the highest power of x</td><td>0, a finite number, or ±∞</td></tr>'+
     '<tr><td>∞ − ∞</td><td>Combine into a single fraction, or multiply by the conjugate if a root is present</td><td>A finite number, often after reducing to 0/0 or ∞/∞</td></tr>'+
     '<tr><td>'+F('k','0')+', k ≠ 0</td><td>Not truly indeterminate. Check the sign of numerator and denominator separately from the left and right</td><td>+∞, −∞, or the two-sided limit does not exist</td></tr>'));

  return sec('limits','4. Limit Techniques &amp; Indeterminate Forms (no L’Hôpital, no growth-rate arguments)',cTable,cChoose,cCold,cIROC,cConj,cForms);
}

function sectionEpsDelta(){
  const card = CARD('',
    P(LM('x→a','f(x)','L')+' means: for every ε &gt; 0 there exists δ &gt; 0 such that 0 &lt; |x − a| &lt; δ ⟹ |f(x) − L| &lt; ε.'),
    OL(['Start from |f(x) − L| &lt; ε','Manipulate it into (constant)·|x − a| &lt; ε','Choose δ = '+F('ε','constant'),'Write the formal proof']),
    P('For expressions like '+F('x<sup>2</sup> − 9','x − 3')+', simplify first (cancel, valid since x ≠ a), then apply the linear approach.','small'));

  const ex = CARD('',
    H3('Worked example'),
    P('Claim: '+LM('x→2','(3x − 1)','5')+'.'),
    P('Scratch work: |f(x) − L| = |(3x − 1) − 5| = |3x − 6| = 3|x − 2|. We want this &lt; ε, so we need |x − 2| &lt; '+F('ε','3')+'. That tells us to pick δ = '+F('ε','3')+'.'),
    P('Formal proof: Let ε &gt; 0. Choose δ = '+F('ε','3')+'. Suppose 0 &lt; |x − 2| &lt; δ. Then:'),
    FM('|(3x − 1) − 5| = |3x − 6| = 3|x − 2| &lt; 3δ = 3·'+F('ε','3')+' = ε.'),
    P('So |f(x) − L| &lt; ε whenever 0 &lt; |x − 2| &lt; δ, which is exactly the definition. Therefore '+LM('x→2','(3x − 1)','5')+'. ∎'),
    P('Note the two-part structure: scratch work (find δ in terms of ε) is not itself the proof. You still have to write the formal “let ε &gt; 0, choose δ = …, then show …” argument for credit.','small'));

  return sec('epsdelta','8. Precise (ε–δ) Definition of a Limit',card,ex);
}

function sectionDerivs(){
  const c1 = CARD('',
    H3('Derivative at a point (3.1)'),
    FM('f′(a) = '+LM('h→0',F('f(a + h) − f(a)','h'))+' = '+LM('x→a',F('f(x) − f(a)','x − a'))),
    P('The expression '+F('f(a + h) − f(a)','h')+' is the <strong>difference quotient</strong> of f at a with increment h. The one limit has four readings: the slope of the graph at a, the slope of the tangent line at a, the rate of change of f with respect to x at a, and the derivative f′(a).'),
    P('Tangent line at (a, f(a)): y − f(a) = f′(a)(x − a).','small'));

  const c2 = CARD('',
    H3('The derivative as a function (3.2)'),
    FM('f′(x) = '+LM('h→0',F('f(x + h) − f(x)','h'))+' = '+LM('z→x',F('f(z) − f(x)','z − x'))),
    P('f is <strong>differentiable</strong> at x if f′(x) exists; differentiation is the process of computing it.'),
    P('Notation: f′(x), y′, '+F('dy','dx')+', '+F('df','dx')+', '+F('d','dx')+' f(x), D(f)(x). Value at a point: '+F('dy','dx')+' evaluated at x = a.'),
    P('Known results: '+F('d','dx')+'('+F('1','x')+') = '+F('−1','x<sup>2</sup>')+', and '+F('d','dx')+R('x')+' = '+F('1','2'+R('x'))+' for x &gt; 0.'));

  const c3 = CARD('',
    H3('Differentiable on an interval'),
    UL(['<strong>Open interval:</strong> a derivative exists at every point.','<strong>Closed interval [a, b]:</strong> differentiable inside, plus a right-hand derivative at a and a left-hand derivative at b.','<strong>Interior point:</strong> f′(c) exists exactly when both one-sided derivatives exist and are equal.']),
    H3('Theorem: differentiable ⟹ continuous'),
    P('If f is differentiable at c, then f is continuous at c. <strong>The converse is false:</strong> |x| is continuous at 0 but not differentiable there.'),
    P('This is a classic True/False target. Be ready to state the theorem and give the counterexample.','small'));

  const c4 = CARD('overflow-x',
    H3('Where a derivative fails to exist'),
    TBL('<tr><th>Failure</th><th>What happens</th><th>Example</th></tr>'+
     '<tr><td>Corner</td><td>One-sided derivatives exist but differ</td><td>|x| at 0</td></tr>'+
     '<tr><td>Cusp</td><td>Slopes go to +∞ on one side and −∞ on the other</td><td>x<sup>2/3</sup> at 0</td></tr>'+
     '<tr><td>Vertical tangent</td><td>Slopes go to +∞ (or −∞) from both sides</td><td>'+R('x')+' at 0</td></tr>'+
     '<tr><td>Discontinuity</td><td>Not continuous, so not differentiable</td><td>Jump or hole</td></tr>'+
     '<tr><td>Wild oscillation</td><td>Slopes oscillate without settling</td><td>x sin('+F('1','x')+') at 0</td></tr>'));

  const c5 = CARD('',
    H3('Worked examples'),
    P('<strong>Tangent to y = '+R('x')+' at x = 4.</strong> Slope:'),
    FM(LM('x→4',F(R('x')+' − 2','x − 4'))+' = '+LM('x→4',F('(x − 4)','(x − 4)('+R('x')+' + 2)'))+' = '+LM('x→4',F('1',R('x')+' + 2'))+' = '+F('1','4')),
    P('The point is (4, 2), so y − 2 = '+F('1','4')+'(x − 4), which gives y = '+F('x','4')+' + 1.'),
    P('<strong>Differentiate f(x) = '+F('x','x − 1')+' by the definition.</strong>'),
    FM('f′(x) = '+LM('h→0',F('1','h'))+'['+F('x + h','x + h − 1')+' − '+F('x','x − 1')+'] = '+LM('h→0',F('(x + h)(x − 1) − x(x + h − 1)','h(x + h − 1)(x − 1)'))),

/* ---------- Quiz setup ---------- */
function renderQuizSetup(){
  const c = el('div');
  c.appendChild(el('button',{class:'backbtn',onclick:()=>{state.view='review';render();}},'← Back to review'));
  c.appendChild(el('h1',{},'Build Your Quiz'));
  const EX = EXAMS[state.exam];
  c.appendChild(el('div',{class:'tag'},EX.bank.length+' questions in the bank, easy to very hard. Pick topics and difficulty, then start. Difficulty is hidden during the quiz and shown on the final review.'));

  const card = CARD('');
  card.appendChild(H3('Topics'));
  const topicRow = el('div');
  EX.topics.forEach(t=>{
    topicRow.appendChild(el('span',{class:'chip'+(state.selectedTopics.has(t)?' on':''),onclick:function(){
      if(state.selectedTopics.has(t)) state.selectedTopics.delete(t); else state.selectedTopics.add(t);
      render(true);
    }},t));
  });
  card.appendChild(topicRow);

  card.appendChild(H3('Difficulty'));
  const diffRow = el('div');
  Object.keys(DIFF_LABEL).forEach(key=>{
    diffRow.appendChild(el('span',{class:'chip'+(state.selectedDiffs.has(key)?' on':''),onclick:function(){
      if(state.selectedDiffs.has(key)) state.selectedDiffs.delete(key); else state.selectedDiffs.add(key);
      render(true);
    }},DIFF_LABEL[key]));
  });
  card.appendChild(diffRow);

  const pool = EX.bank.filter(q=>state.selectedTopics.has(q.topic) && state.selectedDiffs.has(q.diff));
  card.appendChild(P(pool.length+' question(s) match your filters.','small'));
  const startBtn = el('button',pool.length===0?{class:'primarybtn',disabled:''}:{class:'primarybtn',onclick:function(){startQuiz(pool);}},
    pool.length===0 ? 'No questions match — adjust filters' : 'Start Quiz ('+pool.length+' questions)');
  const row = el('div',{class:'btnrow'}); row.appendChild(startBtn);
  card.appendChild(row);
  c.appendChild(card);
  return c;
}

function startQuiz(pool){
  state.quizQuestions = [...pool].sort(()=>Math.random()-0.5).map(q=>{
    const order = q.opts.map((_,i)=>i).sort(()=>Math.random()-0.5);
    return Object.assign({},q,{opts:order.map(i=>q.opts[i]),correct:order.indexOf(q.correct),sel:null,checked:false});
  });
  state.quizIdx = 0;
  state.view = 'quiz';
  render();
}

/* ---------- Quiz ---------- */
function renderQuiz(){
  const c = el('div');
  const qs = state.quizQuestions;
  const total = qs.length;
  const q = qs[state.quizIdx];

  c.appendChild(el('button',{class:'backbtn',onclick:()=>{state.view='quizsetup';render();}},'← Quit quiz'));
  const answered = qs.filter(x=>x.sel!==null).length;
  c.appendChild(P('Question '+(state.quizIdx+1)+' of '+total+' &nbsp;·&nbsp; '+answered+' answered','small sans'));

  const grid = el('div',{class:'navgrid'});
  qs.forEach((x,i)=>{
    let cls = 'navbtn';
    if(x.checked) cls += (x.sel===x.correct ? ' ok' : ' no');
    else if(x.sel!==null) cls += ' sel';
    if(i===state.quizIdx) cls += ' cur';
    grid.appendChild(el('button',{class:cls,onclick:()=>{state.quizIdx=i;render(true);}},String(i+1)));
  });
  c.appendChild(grid);

  c.appendChild(P('<strong>'+q.topic+'</strong>','small sans'));
  c.appendChild(el('div',{class:'qtext',html:q.q}));

  const optWrap = el('div');
  q.opts.forEach((opt,i)=>{
    let cls = 'qopt';
    if(q.checked){
      cls += ' locked';
      if(i===q.correct) cls += ' correct';
      else if(i===q.sel) cls += ' wrong';
    } else if(q.sel===i){
      cls += ' picked';
    }
    optWrap.appendChild(el('button',{class:cls,html:opt,onclick:function(){
      if(q.checked) return;
      q.sel = i;
      render(true);
    }}));
  });
  c.appendChild(optWrap);

  if(q.checked){
    const ok = q.sel===q.correct;
    const box = CARD('');
    box.appendChild(el('p',{html:'<strong>'+(ok?'Correct. ':'Not quite. ')+'</strong>'+q.exp}));
    c.appendChild(box);
  }

  const row = el('div',{class:'btnrow'});
  row.appendChild(el('button',state.quizIdx===0?{class:'secbtn',disabled:''}:{class:'secbtn',onclick:()=>{state.quizIdx--;render(true);}},'← Previous'));
  const canCheck = q.sel!==null && !q.checked;
  row.appendChild(el('button',canCheck?{class:'primarybtn',onclick:()=>{q.checked=true;render(true);}}:{class:'primarybtn',disabled:''},q.checked?'Checked':'Check Answer'));
  row.appendChild(el('button',state.quizIdx===total-1?{class:'secbtn',disabled:''}:{class:'secbtn',onclick:()=>{state.quizIdx++;render(true);}},'Next →'));
  c.appendChild(row);

  const fin = el('div',{class:'btnrow'});
  fin.appendChild(el('button',{class:'secbtn',onclick:()=>{state.view='results';render();}},'Finish and see review'));
  c.appendChild(fin);
  return c;
}

/* ---------- Results / final review ---------- */
function renderResults(){
  const c = el('div');
  const qs = state.quizQuestions;
  const total = qs.length;
  const correct = qs.filter(x=>x.sel===x.correct).length;
  const unanswered = qs.filter(x=>x.sel===null).length;
  const pct = Math.round(100*correct/total);

  c.appendChild(el('h1',{},'Quiz Review'));
  const sum = CARD('');
  sum.appendChild(el('p',{style:'font-size:1.3rem;margin:0.2rem 0;'},'Score: '+correct+' / '+total+' ('+pct+'%)'));
  const msg = pct>=85 ? 'Strong work. You are in good shape for the midterm.' : pct>=60 ? 'Solid, but review the topics you missed before the exam.' : 'Worth another pass through the review sections before you try this again.';
  sum.appendChild(P(msg+(unanswered?' '+unanswered+' unanswered question(s) count as incorrect.':''),'small'));
  c.appendChild(sum);

  const row = el('div',{class:'btnrow'});
  row.appendChild(el('button',{class:'secbtn',onclick:()=>{state.view='quiz';render();}},'← Back to quiz'));
  row.appendChild(el('button',{class:'primarybtn',onclick:()=>{state.view='quizsetup';render();}},'Build a New Quiz'));
  row.appendChild(el('button',{class:'secbtn',onclick:()=>{state.view='review';render();}},'Back to review'));
  c.appendChild(row);

  c.appendChild(el('h2',{style:'margin-top:1.8rem;'},'Question-by-question'));
  qs.forEach((q,i)=>{
    const ok = q.sel===q.correct;
    const card = CARD('revq '+(ok?'ok':'no'));
    card.appendChild(el('div',{class:'revhead',html:'Question '+(i+1)+' &nbsp;·&nbsp; '+q.topic+' &nbsp;·&nbsp; <span class="diffbadge d-'+q.diff+'">'+DIFF_LABEL[q.diff]+'</span>'}));
    card.appendChild(el('div',{class:'qtext',html:q.q}));
    card.appendChild(el('div',{class:'ans '+(ok?'good':'bad'),html:'Your answer: '+(q.sel===null?'Not answered':q.opts[q.sel])}));
    if(!ok) card.appendChild(el('div',{class:'ans good',html:'Correct answer: '+q.opts[q.correct]}));
    card.appendChild(el('p',{class:'small',html:q.exp}));
    c.appendChild(card);
  });
  return c;
}

render();
</script>
