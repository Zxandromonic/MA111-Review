<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MA111 Study Hub</title>
<style>
:root{
 --bg:#161513;--card:#201e19;--ink:#efe9df;--sub:#a39c8e;
 --accent:#96594a;--accent2:#2e5f4e;
 --line:#39342b;--warn-bg:#221d18;--warn-line:#96594a;--good:#3f7c62;--bad:#a56656;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;line-height:1.55;min-height:100%;}
.wrap{max-width:780px;margin:0 auto;padding:2.2rem 1.2rem 4rem;}
h1{font-size:1.7rem;margin:0 0 0.15rem;}
.tag{color:var(--sub);font-size:0.95rem;margin-bottom:1.6rem;font-style:italic;}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
nav{display:flex;flex-wrap:wrap;gap:0.4rem 0.6rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0.8rem 0;margin-bottom:1.8rem;font-size:0.85rem;}
nav a,nav button.linklike{color:var(--accent2);text-decoration:none;background:none;border:none;font:inherit;cursor:pointer;padding:0;}
nav a:hover,nav button.linklike:hover{text-decoration:underline;}
.rule-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:0.9rem 1.1rem;margin-bottom:2rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.92rem;}
.rule-box strong{color:var(--warn-line);}
section{margin-bottom:2.4rem;scroll-margin-top:1rem;}
h2{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:1.15rem;color:var(--accent);border-bottom:2px solid var(--line);padding-bottom:0.3rem;margin-bottom:0.9rem;}
h3{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.98rem;color:var(--accent2);margin:1.1rem 0 0.4rem;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0.9rem 1.1rem;margin-bottom:0.8rem;}
.formula{font-size:1.05rem;margin:0.3rem 0;}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 0.2em;line-height:1.15;font-size:0.92em;}
.frac .num{padding:0 0.2em 0.1em;border-bottom:1px solid currentColor;}
.frac .den{padding:0.1em 0.2em 0;}
.lim-sub{font-size:0.7em;vertical-align:sub;}
ul,ol{margin:0.3rem 0;padding-left:1.3rem;}
li{margin-bottom:0.35rem;}
.small{font-size:0.88rem;color:var(--sub);}
table{width:100%;border-collapse:collapse;font-size:0.88rem;margin:0.5rem 0;}
th,td{border:1px solid var(--line);padding:0.35rem 0.5rem;text-align:center;}
th{background:var(--warn-bg);font-family:-apple-system,sans-serif;font-size:0.78rem;}
.allowed{color:var(--good);font-weight:bold;}
.banned{color:var(--bad);font-weight:bold;}
.overflow-x{overflow-x:auto;}
/* Hero / home */
.hero{text-align:center;padding:2.2rem 0 1.4rem;}
.hero .word{font-size:3.4rem;font-weight:700;letter-spacing:0.04em;margin:0;color:var(--accent);}
.hero .sub{color:var(--sub);font-family:-apple-system,sans-serif;font-size:1rem;margin-top:0.4rem;}
.home-btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.3rem;margin-bottom:0.9rem;cursor:pointer;font-family:-apple-system,sans-serif;font-size:1.05rem;font-weight:600;color:var(--ink);transition:border-color .15s;}
.home-btn:hover{border-color:var(--accent);}
.home-btn .desc{display:block;font-weight:400;font-size:0.85rem;color:var(--sub);margin-top:0.25rem;}
.home-btn.disabled{opacity:0.4;cursor:default;}
.home-btn.disabled:hover{border-color:var(--line);}
.backbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:0.4rem 0.8rem;font-family:-apple-system,sans-serif;font-size:0.85rem;color:var(--sub);cursor:pointer;margin-bottom:1.2rem;}
.backbtn:hover{border-color:var(--accent2);color:var(--accent2);}
/* Quiz */
.chip{display:inline-block;font-family:-apple-system,sans-serif;font-size:0.75rem;padding:0.15rem 0.55rem;border-radius:6px;border:1px solid var(--line);margin:0.1rem;cursor:pointer;user-select:none;}
.chip.on{background:var(--accent2);color:#efe9df;border-color:var(--accent2);}
.diffbadge{font-family:-apple-system,sans-serif;font-size:0.7rem;padding:0.1rem 0.5rem;border-radius:6px;font-weight:600;}
.d-easy{background:#25352a;color:#8fbf9f;}
.d-medium{background:#332c1c;color:#d1b06a;}
.d-hard{background:#32241a;color:#cf8f6a;}
.d-veryhard{background:#331e1c;color:#cf8484;}
.qopt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0.6rem 0.9rem;margin-bottom:0.5rem;cursor:pointer;font-family:-apple-system,sans-serif;font-size:0.95rem;color:var(--ink);}
.qopt:hover{border-color:var(--accent2);}
.qopt.correct{border-color:var(--good);background:var(--warn-bg);}
.qopt.wrong{border-color:var(--bad);background:var(--warn-bg);}
.progressbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:1rem;}
.progressbar>div{height:100%;background:var(--accent2);}
.primarybtn{background:var(--accent2);color:#efe9df;border:none;border-radius:8px;padding:0.6rem 1.2rem;font-family:-apple-system,sans-serif;font-size:0.95rem;cursor:pointer;font-weight:700;}
.primarybtn:hover{opacity:0.88;}
.quizcta{display:block;width:100%;text-align:center;background:var(--accent2);color:#efe9df;border:1px solid var(--line);border-radius:10px;padding:1.1rem;font-family:-apple-system,sans-serif;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:1rem;}
.quizcta:hover{opacity:0.9;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const state = { view: 'home', quizQuestions: [], quizIdx: 0, score: 0, answered: false, selectedTopics: new Set(), selectedDiffs: new Set(['easy','medium','hard','veryhard']) };

const TOPICS = ['Functions','Logs','Trig','Limits','Continuity','IVT','Epsilon-Delta'];
state.selectedTopics = new Set(TOPICS);

const QUIZ_BANK = [
 {topic:'Functions',diff:'easy',q:'What is the range of f(x) = eˣ?',opts:['(-∞,∞)','(0,∞)','[0,∞)','(-∞,0)'],correct:1,exp:'eˣ is always positive and gets arbitrarily close to 0, so range is (0,∞).'},
 {topic:'Functions',diff:'medium',q:'A function is invertible on its whole domain if it is...',opts:['Continuous','One-to-one (passes horizontal line test)','Increasing only','Defined everywhere'],correct:1,exp:'Invertibility requires one-to-one — each output comes from exactly one input.'},
 {topic:'Functions',diff:'hard',q:'If f(x) = (2x+1)/(3x-5), what is the domain of f⁻¹(x)?',opts:['All reals','All reals except 5/3','All reals except 2/3','All reals except 0'],correct:2,exp:'Domain of f⁻¹ = range of f. Since f never outputs 2/3 (its horizontal asymptote), that value is excluded.'},
 {topic:'Functions',diff:'veryhard',q:'Find the domain of f(x) = ln(9 - x²) / √(x+1).',opts:['(-1,3)','(-3,3)','(-1,3]','(-∞,3)'],correct:0,exp:'Need 9-x²>0 → -3<x<3, AND x+1>0 (strict, denominator) → x>-1. Intersection: (-1,3).'},

 {topic:'Logs',diff:'easy',q:'ln(e⁵) = ?',opts:['5','e⁵','1','ln5'],correct:0,exp:'ln and e are inverses, so ln(e⁵)=5.'},
 {topic:'Logs',diff:'medium',q:'log₂(16) - log₂(4) simplifies to:',opts:['2','4','log₂(12)','8'],correct:0,exp:'log₂(16/4) = log₂(4) = 2.'},
 {topic:'Logs',diff:'hard',q:'Simplify e<sup>2ln x + ln y</sup>:',opts:['2x+y','x²y','x²+y','2xy'],correct:1,exp:'2ln x + ln y = ln(x²y), and e<sup>ln(x²y)</sup> = x²y.'},
 {topic:'Logs',diff:'veryhard',q:'If ln(A) = 3ln(x-2) - (1/2)ln(y) + 4, then A equals:',opts:['(x-2)³·e⁴/√y','3(x-2)/√y + 4','(x-2)³√y·e⁴','e⁴(x-2)³ - √y'],correct:0,exp:'Combine logs: ln A = ln[(x-2)³] - ln[√y] + ln(e⁴) = ln[(x-2)³e⁴/√y], so A = (x-2)³e⁴/√y.'},

 {topic:'Trig',diff:'easy',q:'What is the domain of tan(θ)?',opts:['All reals','All reals except π/2 + kπ','All reals except kπ','[-1,1]'],correct:1,exp:'tan(θ)=sin/cos is undefined wherever cos(θ)=0, i.e. θ = π/2 + kπ.'},
 {topic:'Trig',diff:'medium',q:'What is the range of sec(θ)?',opts:['[-1,1]','(-∞,∞)','(-∞,-1]∪[1,∞)','[0,∞)'],correct:2,exp:'sec(θ)=1/cos(θ), and since cos(θ)∈[-1,1] excluding 0-crossings appropriately, |sec(θ)|≥1.'},
 {topic:'Trig',diff:'hard',q:'The restricted domain used to define arccos(x) is:',opts:['[-π/2,π/2]','[0,π]','[-π,0]','(-π/2,π/2)'],correct:1,exp:'cos is restricted to [0,π] to make it one-to-one before inverting.'},
 {topic:'Trig',diff:'veryhard',q:'Solve sin(2θ) = cos(θ) on [0,2π). How many solutions?',opts:['2','3','4','6'],correct:2,exp:'2sinθcosθ - cosθ=0 → cosθ(2sinθ-1)=0. cosθ=0 gives θ=π/2,3π/2; sinθ=1/2 gives θ=π/6,5π/6. Total: 4 solutions.'},

 {topic:'Limits',diff:'easy',q:'lim(x→3) (x²-9)/(x-3) equals:',opts:['0','6','undefined','3'],correct:1,exp:'Factor: (x-3)(x+3)/(x-3) = x+3 → 3+3 = 6.'},
 {topic:'Limits',diff:'easy',q:'lim(x→0) sin(x)/x equals:',opts:['0','1','undefined','∞'],correct:1,exp:'This is the fundamental trig limit, provable via the Squeeze Theorem.'},
 {topic:'Limits',diff:'medium',q:'lim(h→0) [√(4+h)-2]/h equals (use the conjugate, not derivatives):',opts:['1/4','4','1/2','2'],correct:0,exp:'Multiply by conjugate: (4+h-4)/[h(√(4+h)+2)] = 1/(√(4+h)+2) → 1/4.'},
 {topic:'Limits',diff:'medium',q:'lim(x→∞) (3x²+1)/(6x²-x) equals:',opts:['0','1/2','∞','3'],correct:1,exp:'Divide num and denom by x²: (3+1/x²)/(6-1/x) → 3/6 = 1/2.'},
 {topic:'Limits',diff:'hard',q:'lim(x→-2⁺) (x-1)/(x+2) is:',opts:['+∞','-∞','0','-3/2'],correct:1,exp:'As x→-2⁺, numerator→-3 (negative), denominator→0⁺ (positive, tiny). Negative/tiny-positive → -∞.'},
 {topic:'Limits',diff:'hard',q:'lim(x→0) tan(3x)/sin(5x) equals:',opts:['3/5','5/3','0','1'],correct:0,exp:'Rewrite as [sin3x/3x·3x]/[cos3x·sin5x/5x·5x] = (3/5)·(1/cos0) = 3/5.'},
 {topic:'Limits',diff:'veryhard',q:'lim(x→∞) [x - √(x²+3x)] equals (must rationalize, no shortcuts):',opts:['0','-3/2','∞','3'],correct:1,exp:'Multiply by conjugate over itself: (x²-(x²+3x))/(x+√(x²+3x)) = -3x/(x+√(x²+3x)); divide by x → -3/(1+1) = -3/2.'},
 {topic:'Limits',diff:'veryhard',q:'This is an ∞−∞ form: lim(x→∞) [√(x²+6x) − x]. What technique applies first?',opts:['Multiply by the conjugate','Divide by x immediately','Squeeze Theorem','Factor and cancel'],correct:0,exp:'∞−∞ forms with radicals are handled by multiplying by the conjugate first, which converts it into a ∞/∞ form you can then divide through.'},

 {topic:'Continuity',diff:'easy',q:'For f to be continuous at x=c, which is NOT required?',opts:['f(c) exists','lim(x→c) f(x) exists','f is differentiable at c','lim(x→c) f(x) = f(c)'],correct:2,exp:'Continuity requires the 3-part limit definition — differentiability is a stronger, separate condition.'},
 {topic:'Continuity',diff:'medium',q:'A function is right-continuous at c if:',opts:['lim(x→c⁻)f(x)=f(c)','lim(x→c⁺)f(x)=f(c)','f(c) is undefined','lim(x→c)f(x) does not exist'],correct:1,exp:'Right-continuity only checks the limit from the right side against f(c).'},
 {topic:'Continuity',diff:'hard',q:'f(x)=ax²+3 for x<2 and f(x)=5x-a for x≥2. Find a so f is continuous at x=2.',opts:['a=1','a=7/5','a=2','a=5'],correct:1,exp:'Set 4a+3 = 10-a → 5a=7 → a=7/5.'},
 {topic:'Continuity',diff:'veryhard',q:'g(x) = (x²-4)/(x-2) for x≠2, g(2)=5. At x=2, g is:',opts:['Continuous','Discontinuous, removable','Discontinuous, jump','Discontinuous, infinite'],correct:1,exp:'lim(x→2) g(x) = 4 ≠ g(2)=5, so the limit exists but disagrees with the function value — a removable discontinuity.'},

 {topic:'IVT',diff:'easy',q:'IVT requires f to be continuous on:',opts:['An open interval (a,b)','A closed interval [a,b]','All real numbers','Just the endpoints'],correct:1,exp:'The theorem\'s hypothesis is continuity on the closed interval [a,b].'},
 {topic:'IVT',diff:'medium',q:'IVT guarantees:',opts:['Exactly one solution','At least one solution','No solutions','A unique maximum'],correct:1,exp:'IVT only guarantees existence of at least one c — not uniqueness.'},
 {topic:'IVT',diff:'hard',q:'To show x³-4x+1=0 has a root in [0,1] via IVT, the key step is showing:',opts:['f is a polynomial (hence continuous) and f(0), f(1) have opposite signs','f(0)=f(1)','f is increasing on [0,1]','f has a critical point in [0,1]'],correct:0,exp:'You need continuity (guaranteed since f is a polynomial) plus f(0) and f(1) straddling 0.'},
 {topic:'IVT',diff:'veryhard',q:'Which statement about IVT is FALSE?',opts:['If f(a) and f(b) have the same sign, IVT cannot be used to guarantee a root','IVT requires only that f be defined on [a,b], not continuous','A sketch alone is not a valid IVT proof','IVT can be applied to f(x)=cos(x)-x to find a fixed point'],correct:1,exp:'IVT explicitly requires continuity on [a,b] — merely being defined is not sufficient.'},

 {topic:'Epsilon-Delta',diff:'medium',q:'The ε-δ definition of lim(x→a)f(x)=L requires: whenever 0<|x-a|<δ, then:',opts:['|f(x)-L|<ε','|x-a|<ε','f(x)=L','|f(x)-L|<δ'],correct:0,exp:'The conclusion of the definition bounds |f(x)-L| by ε, not δ.'},
 {topic:'Epsilon-Delta',diff:'hard',q:'To prove lim(x→2)(4x-3)=5 via ε-δ, the correct choice of δ (in terms of ε) is:',opts:['δ=ε','δ=ε/4','δ=4ε','δ=ε²'],correct:1,exp:'|f(x)-L|=|4x-3-5|=4|x-2|<ε requires |x-2|<ε/4, so δ=ε/4.'},
 {topic:'Epsilon-Delta',diff:'veryhard',q:'For lim(x→3)(x²-9)/(x-3)=6, before applying the standard δ=ε argument, you must first:',opts:['Take the derivative','Simplify the expression by canceling (x-3), valid since x≠3 in the definition','Apply L\'Hôpital\'s Rule','Assume x=3 directly'],correct:1,exp:'Since 0<|x-a| excludes x=a itself, canceling (x-3) is valid, reducing the expression to x+3 for the ε-δ argument.'}
];

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.forEach(c=>{ if(typeof c==='string') e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}
function fracHTML(numHTML, denHTML){
  return '<span class="frac"><span class="num">'+numHTML+'</span><span class="den">'+denHTML+'</span></span>';
}
function limHTML(sub, bodyHTML, resultHTML){
  return 'lim<span class="lim-sub">'+sub+'</span> '+bodyHTML+(resultHTML? ' = '+resultHTML : '');
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view==='home') app.appendChild(renderHome());
  else if(state.view==='review') app.appendChild(renderReview());
  else if(state.view==='quizsetup') app.appendChild(renderQuizSetup());
  else if(state.view==='quiz') app.appendChild(renderQuiz());
  else if(state.view==='results') app.appendChild(renderResults());
  window.scrollTo(0,0);
}

function renderHome(){
  const c = el('div');
  const hero = el('div',{class:'hero'});
  hero.appendChild(el('div',{class:'word'},'MA111'));
  hero.appendChild(el('div',{class:'sub'},'Calculus I — Study Hub'));
  c.appendChild(hero);
  c.appendChild(el('div',{class:'tag'},'Pick an exam to review. More units get added as the term goes on.'));
  const btn1 = el('button',{class:'home-btn',onclick:()=>{state.view='review';render();}},
    'Midterm 1 Review',
    el('span',{class:'desc'},'Functions, logs, trig, limits & indeterminate forms, continuity, IVT, ε-δ — plus a 25-question practice quiz'));
  c.appendChild(btn1);
  ['Midterm 2 Review','Midterm 3 Review','Midterm 4 Review','Final Review'].forEach(t=>{
    c.appendChild(el('div',{class:'home-btn disabled'}, t, el('span',{class:'desc'},'Coming later this term')));
  });
  return c;
}

function backBtn(){
  return el('button',{class:'backbtn',onclick:()=>{state.view='home';render();}},'← Back to units');
}

function renderReview(){
  const c = el('div');
  c.appendChild(backBtn());
  c.appendChild(el('h1',{},'Midterm 1 Review'));
  c.appendChild(el('div',{class:'tag'},'Functions · Limits · Continuity · IVT'));

  const navLinks = ['functions','logs','trig','limits','squeeze','continuity','ivt','epsdelta'];
  const navLabels = ['Functions','Logs','Trig','Limits','Squeeze','Continuity','IVT','ε-δ'];
  const nav = el('nav');
  navLinks.forEach((id,i)=> nav.appendChild(el('a',{href:'#'+id},navLabels[i])) );
  c.appendChild(nav);

  c.appendChild(el('div',{class:'rule-box'},
    el('strong',{},'Exam constraints: '),
    'No L\u2019Hôpital\u2019s Rule and no "growth rate" hand-waving — every limit must be solved algebraically (factoring, conjugates, trig identities, or dividing by the highest power of x). One True/False question and one detailed IVT question (possibly requiring you to define related theorems) will appear.'
  ));

  c.appendChild(sectionFunctions());
  c.appendChild(sectionLogs());
  c.appendChild(sectionTrig());
  c.appendChild(sectionLimits());
  c.appendChild(sectionSqueeze());
  c.appendChild(sectionContinuity());
  c.appendChild(sectionIVT());
  c.appendChild(sectionEpsDelta());

  const quizBtn = el('button',{class:'quizcta',onclick:()=>{state.view='quizsetup';render();}},'Take the Practice Quiz →');
  c.appendChild(quizBtn);

  return c;
}

function sec(id, title, ...cards){
  const s = el('section',{id});
  s.appendChild(el('h2',{},title));
  cards.forEach(c=>s.appendChild(c));
  return s;
}

function sectionFunctions(){
  const card = el('div',{class:'card'});
  card.appendChild(el('p',{class:'small'},'"Functions" here means the core families you\u2019re expected to know cold: trigonometric functions (sin, cos, tan, etc. — see the Trig section below), logarithmic functions (ln, log base a), and exponential functions (eˣ, aˣ) — plus how to find domain, range, and inverses for any combination of them.'));
  card.appendChild(el('h3',{},'Domain/Range checklist'));
  card.appendChild(el('ul',{html:'<li>Denominators ≠ 0</li><li>Even roots: radicand ≥ 0</li><li>Logarithms: argument &gt; 0</li><li>eˣ has domain (−∞,∞), range (0,∞)</li><li>ln(x) has domain (0,∞), range (−∞,∞)</li>'}));
  card.appendChild(el('h3',{},'Finding an inverse'));
  card.appendChild(el('ol',{html:'<li>Replace f(x) with y</li><li>Swap x and y</li><li>Solve for y</li><li>Domain of f⁻¹ = Range of f; Range of f⁻¹ = Domain of f</li>'}));
  card.appendChild(el('p',{class:'small'},'Invertible ⟺ one-to-one (horizontal line test). Restricting domain is how sin/cos/tan get inverses.'));
  return sec('functions','1. Functions: Domain, Range, Inverses', card);
}

function sectionLogs(){
  const card = el('div',{class:'card overflow-x'});
  card.appendChild(el('table',{html:`<tr><th>Exponent Rule</th><th>Log Rule</th></tr>
   <tr><td>aᵐaⁿ = aᵐ⁺ⁿ</td><td>log(mn) = log m + log n</td></tr>
   <tr><td>${fracHTML('aᵐ','aⁿ')} = aᵐ⁻ⁿ</td><td>log(${fracHTML('m','n')}) = log m − log n</td></tr>
   <tr><td>(aᵐ)ⁿ = aᵐⁿ</td><td>log(mⁿ) = n·log m</td></tr>
   <tr><td>a⁰ = 1</td><td>logₐ(1) = 0</td></tr>
   <tr><td>e<sup>ln x</sup> = x</td><td>ln(eˣ) = x</td></tr>`}));
  card.appendChild(el('p',{class:'small'},'Trap: log(m + n) ≠ log m + log n. No rule for the log of a sum.'));
  return sec('logs','2. Log & Exponent Laws', card);
}

function sectionTrig(){
  const card1 = el('div',{class:'card overflow-x'});
  card1.appendChild(el('h3',{},'Unit circle — first quadrant'));
  card1.appendChild(el('table',{html:`<tr><th>θ</th><th>0</th><th>${fracHTML('π','6')}</th><th>${fracHTML('π','4')}</th><th>${fracHTML('π','3')}</th><th>${fracHTML('π','2')}</th></tr>
   <tr><td>sin θ</td><td>0</td><td>${fracHTML('1','2')}</td><td>${fracHTML('√2','2')}</td><td>${fracHTML('√3','2')}</td><td>1</td></tr>
   <tr><td>cos θ</td><td>1</td><td>${fracHTML('√3','2')}</td><td>${fracHTML('√2','2')}</td><td>${fracHTML('1','2')}</td><td>0</td></tr>`}));
  card1.appendChild(el('p',{class:'small'},'Extend to other quadrants using reference angles and ASTC (All/Sin/Tan/Cos positive by quadrant, going counterclockwise from QI).'));

  const card2 = el('div',{class:'card overflow-x'});
  card2.appendChild(el('h3',{},'All six trig functions — domain & range'));
  card2.appendChild(el('table',{html:`<tr><th>f(θ)</th><th>Definition</th><th>Domain</th><th>Range</th></tr>
   <tr><td>sin θ</td><td>—</td><td>(−∞,∞)</td><td>[−1,1]</td></tr>
   <tr><td>cos θ</td><td>—</td><td>(−∞,∞)</td><td>[−1,1]</td></tr>
   <tr><td>tan θ</td><td>${fracHTML('sin θ','cos θ')}</td><td>θ ≠ π/2+kπ</td><td>(−∞,∞)</td></tr>
   <tr><td>csc θ</td><td>${fracHTML('1','sin θ')}</td><td>θ ≠ kπ</td><td>(−∞,−1]∪[1,∞)</td></tr>
   <tr><td>sec θ</td><td>${fracHTML('1','cos θ')}</td><td>θ ≠ π/2+kπ</td><td>(−∞,−1]∪[1,∞)</td></tr>
   <tr><td>cot θ</td><td>${fracHTML('cos θ','sin θ')}</td><td>θ ≠ kπ</td><td>(−∞,∞)</td></tr>`}));

  const card3 = el('div',{class:'card overflow-x'});
  card3.appendChild(el('h3',{},'Inverse trig — restricted domains & ranges'));
  card3.appendChild(el('table',{html:`<tr><th>Inverse</th><th>Domain</th><th>Range (restricted output)</th></tr>
   <tr><td>arcsin(x)</td><td>[−1,1]</td><td>[−π/2, π/2]</td></tr>
   <tr><td>arccos(x)</td><td>[−1,1]</td><td>[0, π]</td></tr>
   <tr><td>arctan(x)</td><td>(−∞,∞)</td><td>(−π/2, π/2)</td></tr>`}));
  card3.appendChild(el('p',{class:'small'},'These ranges ARE the restricted domains of sin, cos, tan that make them one-to-one before inverting.'));

  const card4 = el('div',{class:'card'});
  card4.appendChild(el('h3',{},'Identities to know cold'));
  card4.appendChild(el('div',{class:'formula'},'sin²θ + cos²θ = 1'));
  card4.appendChild(el('div',{class:'formula'},'tan²θ + 1 = sec²θ'));
  card4.appendChild(el('div',{class:'formula'},'1 + cot²θ = csc²θ'));
  card4.appendChild(el('div',{class:'formula'},'sin(2θ) = 2 sin θ cos θ'));
  card4.appendChild(el('div',{class:'formula',html:'sin(−θ) = −sin θ&nbsp;&nbsp;(odd)&nbsp;&nbsp;&nbsp;&nbsp;cos(−θ) = cos θ&nbsp;&nbsp;(even)'}));
  card4.appendChild(el('p',{class:'small'},'The three Pythagorean identities are all derived from sin²+cos²=1 by dividing through by sin²θ or cos²θ.'));

  return sec('trig','3. Unit Circle & Trig — Full Reference', card1, card2, card3, card4);
}

function sectionLimits(){
  const card = el('div',{class:'card'});
  card.appendChild(el('table',{html:`<tr><th>Technique</th><th>Allowed?</th></tr>
   <tr><td>Factor & cancel</td><td class="allowed">✓ Yes</td></tr>
   <tr><td>Multiply by the conjugate</td><td class="allowed">✓ Yes</td></tr>
   <tr><td>Common denominator, then simplify</td><td class="allowed">✓ Yes</td></tr>
   <tr><td>Trig identities → sin(x)/x form</td><td class="allowed">✓ Yes</td></tr>
   <tr><td>Divide by highest power of x (limits at ∞)</td><td class="allowed">✓ Yes</td></tr>
   <tr><td>Squeeze Theorem</td><td class="allowed">✓ Yes</td></tr>
   <tr><td>L\u2019Hôpital\u2019s Rule</td><td class="banned">✗ Banned</td></tr>
   <tr><td>"Exponentials beat polynomials" reasoning</td><td class="banned">✗ Banned</td></tr>`}));
  const cardCold = el('div',{class:'card'});
  cardCold.appendChild(el('h3',{},'The limit to know cold'));
  cardCold.appendChild(el('div',{class:'formula', html:limHTML('x→0', fracHTML('sin x','x'), '1')}));
  cardCold.appendChild(el('p',{class:'small'},'Any limit that looks like sin(kx)/(kx) as x→0 reduces to this by multiplying to build the matching argument in numerator and denominator. This is the standard move behind trig-limit problems, and it\u2019s proven using the Squeeze Theorem.'));

  const cardIROC = el('div',{class:'card'});
  cardIROC.appendChild(el('h3',{},'The instantaneous-rate-of-change (difference quotient) limits'));
  cardIROC.appendChild(el('p',{class:'small'},'These are the two equivalent limit forms that define the slope of the tangent line / instantaneous rate of change at a point. They\u2019ll come back constantly once derivatives start, so it\u2019s worth being fluent with the algebra (factoring, expanding, simplifying) now.'));
  cardIROC.appendChild(el('div',{class:'formula', html:limHTML('h→0', fracHTML('f(x+h) − f(x)','h'), '')}));
  cardIROC.appendChild(el('div',{class:'formula', html:limHTML('x→a', fracHTML('f(x) − f(a)','x − a'), '')}));
  cardIROC.appendChild(el('p',{class:'small'},'Both compute the same thing — the first slides a second point in by a small step h from x, the second slides a variable point x in toward the fixed point a. Both are 0/0 as written, so they need to be simplified (expand f(x+h), factor, cancel the h or the (x−a)) before you can plug in.'));

  const cardConj = el('div',{class:'card'});
  cardConj.appendChild(el('h3',{},'The conjugate method (for 0/0 with a root)'));
  cardConj.appendChild(el('p',{},'Whenever a limit produces 0/0 and a square root appears in the numerator or denominator, multiply top and bottom by the conjugate of the radical expression (flip the middle sign). The radical disappears via difference of squares: (a−b)(a+b) = a²−b². This usually turns the offending factor into something that cancels with the rest of the expression, removing the 0/0.'));
  cardConj.appendChild(el('p',{class:'small'},'Works the same way for an ∞−∞ limit involving a root — multiplying by the conjugate converts it into a ∞/∞ (or eventually a finite-value) form you can then handle by dividing by the highest power of x.'));

  const cardForms = el('div',{class:'card overflow-x'});
  cardForms.appendChild(el('h3',{},'The indeterminate forms we\u2019ve covered so far'));
  cardForms.appendChild(el('p',{class:'small'},'These are the forms we\u2019ve actually discussed in this course. Plugging in directly gives something that could evaluate to different things depending on the functions involved, so more algebra is needed before you can read off the answer.'));
  cardForms.appendChild(el('table',{html:`<tr><th>Form</th><th>Try this (no L'Hôpital)</th><th>Typical result</th></tr>
   <tr><td>${fracHTML('0','0')}</td><td>Factor & cancel, or multiply by the conjugate</td><td>A finite number</td></tr>
   <tr><td>${fracHTML('∞','∞')}</td><td>Divide top and bottom by the highest power of x</td><td>0, a finite number, or ±∞</td></tr>
   <tr><td>∞ − ∞</td><td>Combine into a single fraction, or multiply by the conjugate if a root is present</td><td>A finite number, often after reducing to 0/0 or ∞/∞</td></tr>
   <tr><td>${fracHTML('k','0')}, k ≠ 0</td><td>Not truly indeterminate — check the sign of numerator and denominator separately from the left and right</td><td>+∞, −∞, or the two-sided limit does not exist</td></tr>`}));

  return sec('limits','4. Limit Techniques & Indeterminate Forms (no L\u2019Hôpital, no growth-rate arguments)', card, cardCold, cardIROC, cardConj, cardForms);
}

function sectionSqueeze(){
  const card = el('div',{class:'card'});
  card.appendChild(el('p',{},'If g(x) ≤ f(x) ≤ h(x) near c, and lim g(x) = lim h(x) = L as x→c, then lim f(x) = L too.'));
  card.appendChild(el('p',{class:'small'},'Name the theorem and confirm both outer limits before concluding.'));
  return sec('squeeze','5. Squeeze (Sandwich) Theorem', card);
}

function sectionContinuity(){
  const card = el('div',{class:'card'});
  card.appendChild(el('p',{},'f is continuous at x=c if lim(x→c) f(x) = f(c). This requires THREE things:'));
  card.appendChild(el('ol',{html:'<li>f(c) exists</li><li>lim(x→c) f(x) exists (left limit = right limit)</li><li>That limit equals f(c)</li>'}));
  card.appendChild(el('p',{class:'small'},'Left-continuous at c: lim(x→c⁻) f(x)=f(c). Right-continuous: lim(x→c⁺) f(x)=f(c). Check both separately at domain-boundary points.'));
  return sec('continuity','6. Continuity', card);
}

function sectionIVT(){
  const card = el('div',{class:'card'});
  card.appendChild(el('p',{},'If f is continuous on [a,b] and N is between f(a) and f(b), there exists c ∈ (a,b) with f(c)=N.'));
  card.appendChild(el('h3',{},'Full-credit answer structure'));
  card.appendChild(el('ol',{html:'<li>State the theorem by name</li><li>Verify continuity on [a,b] explicitly</li><li>Define f(x) if given an equation (e.g. cos θ = θ → f(θ)=cosθ−θ)</li><li>Compute f(a), f(b), show N is strictly between</li><li>Conclude: "By IVT, ∃c with f(c)=N"</li>'}));
  card.appendChild(el('h3',{},'Related theorems they may ask you to define'));
  card.appendChild(el('ul',{html:'<li>Continuity Test (the 3-part definition)</li><li>Why the interval must be closed</li><li>Existence vs. uniqueness — IVT gives at least one root, not exactly one</li><li>A sketch is not a proof</li>'}));
  return sec('ivt','7. Intermediate Value Theorem', card);
}

function sectionEpsDelta(){
  const card = el('div',{class:'card'});
  card.appendChild(el('p',{},'lim(x→a) f(x)=L means: for every ε>0, ∃δ>0 such that 0<|x−a|<δ ⟹ |f(x)−L|<ε.'));
  card.appendChild(el('ol',{html:'<li>Start from |f(x)−L|<ε</li><li>Manipulate into (constant)·|x−a|<ε</li><li>Choose δ='+fracHTML('ε','(constant)')+'</li><li>Write the formal proof</li>'}));
  card.appendChild(el('p',{class:'small'},'For expressions like (x²−9)/(x−3), simplify first (cancel, valid since x≠a), then apply the linear approach.'));

  const cardEx = el('div',{class:'card'});
  cardEx.appendChild(el('h3',{},'Worked example'));
  cardEx.appendChild(el('p',{},'Claim: lim(x→2) (3x − 1) = 5.'));
  cardEx.appendChild(el('p',{html:'Scratch work: |f(x) − L| = |(3x−1) − 5| = |3x − 6| = 3|x − 2|. We want this &lt; ε, so we need |x−2| &lt; '+fracHTML('ε','3')+'. This tells us to pick δ = '+fracHTML('ε','3')+'.'}));
  cardEx.appendChild(el('p',{html:'Formal proof: Let ε &gt; 0. Choose δ = '+fracHTML('ε','3')+'. Suppose 0 &lt; |x − 2| &lt; δ. Then:'}));
  cardEx.appendChild(el('div',{class:'formula', html:'|(3x−1) − 5| = |3x − 6| = 3|x − 2| &lt; 3δ = 3'+fracHTML('ε','3')+' = ε.'}));
  cardEx.appendChild(el('p',{},'So |f(x) − L| < ε whenever 0 < |x−2| < δ, which is exactly the definition. Therefore lim(x→2) (3x−1) = 5. ∎'));
  cardEx.appendChild(el('p',{class:'small'},'Note the two-part structure every time: scratch work (find δ in terms of ε) is not itself the proof — you still have to write the formal "let ε>0, choose δ=..., then show..." argument for credit.'));

  return sec('epsdelta','8. Precise (ε–δ) Definition of a Limit', card, cardEx);
}

// ---------- QUIZ ----------
function renderQuizSetup(){
  const c = el('div');
  c.appendChild(el('button',{class:'backbtn',onclick:()=>{state.view='review';render();}},'← Back to review'));
  c.appendChild(el('h1',{},'Build Your Quiz'));
  c.appendChild(el('div',{class:'tag'},'25 questions total in the bank, easy → very hard. Pick topics and difficulty, then start.'));

  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'Topics'));
  const topicRow = el('div');
  TOPICS.forEach(t=>{
    const chip = el('span',{class:'chip'+(state.selectedTopics.has(t)?' on':''), onclick:function(){
      if(state.selectedTopics.has(t)) state.selectedTopics.delete(t); else state.selectedTopics.add(t);
      render();
    }}, t);
    topicRow.appendChild(chip);
  });
  card.appendChild(topicRow);

  card.appendChild(el('h3',{},'Difficulty'));
  const diffRow = el('div');
  [['easy','Easy'],['medium','Medium'],['hard','Hard'],['veryhard','Very Hard']].forEach(([key,label])=>{
    const chip = el('span',{class:'chip'+(state.selectedDiffs.has(key)?' on':''), onclick:function(){
      if(state.selectedDiffs.has(key)) state.selectedDiffs.delete(key); else state.selectedDiffs.add(key);
      render();
    }}, label);
    diffRow.appendChild(chip);
  });
  card.appendChild(diffRow);

  const pool = QUIZ_BANK.filter(q=>state.selectedTopics.has(q.topic) && state.selectedDiffs.has(q.diff));
  card.appendChild(el('p',{class:'small'},pool.length+' question(s) match your filters.'));

  const startBtn = el('button',{class:'primarybtn',onclick:function(){
    if(pool.length===0) return;
    state.quizQuestions = [...pool].sort(()=>Math.random()-0.5);
    state.quizIdx = 0; state.score = 0; state.answered = false;
    state.view='quiz'; render();
  }}, pool.length===0 ? 'No questions match — adjust filters' : 'Start Quiz ('+pool.length+' questions)');
  card.appendChild(el('div',{style:'margin-top:0.8rem'}));
  card.lastChild.appendChild(startBtn);

  c.appendChild(card);
  return c;
}

function renderQuiz(){
  const c = el('div');
  const q = state.quizQuestions[state.quizIdx];
  const total = state.quizQuestions.length;
  c.appendChild(el('div',{class:'progressbar'}, el('div',{style:'width:'+(100*state.quizIdx/total)+'%'})));
  c.appendChild(el('p',{class:'small sans'}, 'Question '+(state.quizIdx+1)+' of '+total+'  ·  Score: '+state.score));
  const badge = el('span',{class:'diffbadge d-'+q.diff}, q.diff==='veryhard'?'Very Hard':(q.diff.charAt(0).toUpperCase()+q.diff.slice(1)));
  const topicLine = el('p',{class:'small sans'}, q.topic+' — ');
  topicLine.appendChild(badge);
  c.appendChild(topicLine);
  c.appendChild(el('h2',{style:'border:none;', html:q.q}));

  const optWrap = el('div',{id:'optwrap'});
  q.opts.forEach((opt,i)=>{
    const b = el('button',{class:'qopt', html:opt, onclick:function(){ selectAnswer(i); }});
    optWrap.appendChild(b);
  });
  c.appendChild(optWrap);

  const expBox = el('div',{class:'card hidden', id:'expbox'});
  c.appendChild(expBox);

  const nextRow = el('div',{style:'margin-top:1rem;'});
  const nextBtn = el('button',{class:'primarybtn hidden', id:'nextbtn', onclick:function(){
    if(state.quizIdx+1 < total){ state.quizIdx++; state.answered=false; render(); }
    else { state.view='results'; render(); }
  }}, state.quizIdx+1<total ? 'Next Question' : 'See Results');
  nextRow.appendChild(nextBtn);
  c.appendChild(nextRow);

  return c;
}

function selectAnswer(i){
  if(state.answered) return;
  state.answered = true;
  const q = state.quizQuestions[state.quizIdx];
  const buttons = document.querySelectorAll('#optwrap .qopt');
  buttons.forEach((b,idx)=>{
    b.style.cursor='default';
    if(idx===q.correct) b.classList.add('correct');
    else if(idx===i) b.classList.add('wrong');
  });
  if(i===q.correct) state.score++;
  const expbox = document.getElementById('expbox');
  expbox.classList.remove('hidden');
  expbox.innerHTML = '<strong>'+(i===q.correct ? 'Correct. ' : 'Not quite. ')+'</strong>'+q.exp;
  document.getElementById('nextbtn').classList.remove('hidden');
  document.querySelector('.wrap .small.sans').textContent = 'Question '+(state.quizIdx+1)+' of '+state.quizQuestions.length+'  ·  Score: '+state.score;
}

function renderResults(){
  const c = el('div');
  const total = state.quizQuestions.length;
  const pct = Math.round(100*state.score/total);
  c.appendChild(el('h1',{},'Quiz Complete'));
  const card = el('div',{class:'card'});
  card.appendChild(el('p',{style:'font-size:1.3rem;'}, 'Score: '+state.score+' / '+total+' ('+pct+'%)'));
  let msg = pct>=85 ? 'Strong work — you\u2019re in good shape for the midterm.' : pct>=60 ? 'Solid, but review the topics you missed before the exam.' : 'Worth another pass through the review sections before you take this again.';
  card.appendChild(el('p',{class:'small'}, msg));
  c.appendChild(card);
  const retryBtn = el('button',{class:'primarybtn',onclick:()=>{state.view='quizsetup';render();}},'Try Different Questions');
  c.appendChild(retryBtn);
  c.appendChild(el('div',{style:'margin-top:0.6rem'}));
  c.lastChild.appendChild(el('button',{class:'backbtn',onclick:()=>{state.view='review';render();}},'Back to review'));
  return c;
}

render();
</script>
